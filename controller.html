<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wemble Cricket – Controller</title><link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script></head>
<body><div id="join" class="panel"><h1>JOIN</h1>
<input id="room" placeholder="Room code" maxlength="4" autocapitalize="characters"><input id="name" placeholder="Your name" maxlength="12"><div id="sw"></div>
<button id="go">Join match</button><p id="hint"></p></div>
<div id="pad" class="hide"><div id="zone"><div id="base"><div id="knob"></div></div></div>
<div id="stat">Connecting…</div><button id="edit" class="hide">Name / color</button><button id="fs">⛶</button><button id="tilt">Tilt: off</button>
<button id="start" class="hide">Start match</button><button id="act" class="hide">SWING</button></div>
<script src="js/controller.js"></script></body></html>
